<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Streak Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>Habit Streak Tracker</h1>
      <p>Add habits, mark daily progress, and build streaks.</p>
    </header>

    <form id="habit-form">
      <input id="habit-name" type="text" placeholder="Example: Read 20 minutes" required />
      <button type="submit">Add Habit</button>
    </form>

    <div id="habit-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
